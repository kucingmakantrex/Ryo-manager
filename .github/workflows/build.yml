name: Build Ryo Manager APK

# Cukup upload SATU file ini ke .github/workflows/build.yml
# Seluruh project Android (kode + icon) dibuat otomatis oleh workflow.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Generate project
        run: |
          mkdir -p $RUNNER_TEMP/proj
          cd $RUNNER_TEMP/proj
          mkdir -p app
          cat > app/build.gradle <<'EOF_FILE'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.ryo.manager'
              compileSdk 34
              defaultConfig {
                  applicationId "com.ryo.manager"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          EOF_FILE
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Ryo Manager"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@android:style/Theme.DeviceDefault">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p app/src/main/java/com/ryo/manager
          cat > app/src/main/java/com/ryo/manager/MainActivity.kt <<'EOF_FILE'
          package com.ryo.manager

          import android.animation.ValueAnimator
          import android.app.Activity
          import android.app.ActivityManager
          import android.app.AlertDialog
          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.os.Environment
          import android.os.Handler
          import android.os.Looper
          import android.os.StatFs
          import android.view.Gravity
          import android.view.View
          import android.view.animation.LinearInterpolator
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import java.util.Locale
          import kotlin.math.PI
          import kotlin.math.max
          import kotlin.math.sin

          /** Progress bar bergelombang (bagian terisi) + garis lurus (sisa), mirip Material 3 wavy. */
          class WaveBar(ctx: Context) : View(ctx) {
              var progress = 0f
                  set(v) { field = v.coerceIn(0f, 1f); invalidate() }

              private var phase = 0f
              private val d = ctx.resources.displayMetrics.density
              private val green = Color.parseColor("#7EE8A0")

              private val wavePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE; strokeWidth = 4 * d
                  strokeCap = Paint.Cap.ROUND; color = green
              }
              private val trackPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE; strokeWidth = 4 * d
                  strokeCap = Paint.Cap.ROUND; color = Color.parseColor("#3C463E")
              }
              private val dotPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = green }
              private val path = Path()

              private val animator = ValueAnimator.ofFloat(0f, (2 * PI).toFloat()).apply {
                  duration = 1800
                  repeatCount = ValueAnimator.INFINITE
                  interpolator = LinearInterpolator()
                  addUpdateListener { phase = it.animatedValue as Float; invalidate() }
              }

              override fun onAttachedToWindow() { super.onAttachedToWindow(); animator.start() }
              override fun onDetachedFromWindow() { animator.cancel(); super.onDetachedFromWindow() }

              override fun onDraw(c: Canvas) {
                  val pad = 3 * d
                  val w = width.toFloat()
                  val cy = height / 2f
                  val endX = pad + (w - 2 * pad) * progress
                  val gap = 6 * d
                  val amp = 3 * d
                  val wl = 28 * d
                  val twoPi = (2 * PI).toFloat()

                  val waveEnd = endX - gap / 2
                  if (waveEnd > pad) {
                      path.reset()
                      var x = pad
                      path.moveTo(x, cy + amp * sin(-phase))
                      while (x < waveEnd) {
                          x = minOf(x + 2 * d, waveEnd)
                          path.lineTo(x, cy + amp * sin(twoPi * (x - pad) / wl - phase))
                      }
                      c.drawPath(path, wavePaint)
                  }
                  val trackStart = max(endX + gap / 2, pad)
                  val trackEnd = w - pad
                  if (trackStart < trackEnd) c.drawLine(trackStart, cy, trackEnd, cy, trackPaint)
                  c.drawCircle(trackEnd, cy, 2.5f * d, dotPaint)
              }
          }

          class MainActivity : Activity() {

              private val base = "/sys/devices/system/cpu/cpufreq"
              private val green = Color.parseColor("#7EE8A0")
              private val bg = Color.parseColor("#0F1511")

              private lateinit var root: LinearLayout
              private lateinit var cpuBox: LinearLayout

              private class ResCard(val bar: WaveBar, val pct: TextView, val detail: TextView)
              private lateinit var ramCard: ResCard
              private lateinit var internalCard: ResCard
              private lateinit var sharedCard: ResCard

              private val handler = Handler(Looper.getMainLooper())
              private val ticker = object : Runnable {
                  override fun run() { updateResources(); handler.postDelayed(this, 2000) }
              }

              data class Policy(
                  val id: Int, val cores: String,
                  val min: Long, val max: Long, val gov: String,
                  val freqs: List<Long>, val govs: List<String>
              )

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = bg
                  window.navigationBarColor = bg

                  root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(24), dp(16), dp(32))
                  }
                  setContentView(ScrollView(this).apply {
                      setBackgroundColor(bg)
                      addView(root)
                  })

                  root.addView(label("Ryo Manager", 28f, Color.WHITE).apply {
                      typeface = Typeface.DEFAULT_BOLD
                      setPadding(dp(4), 0, 0, dp(8))
                  })

                  // ----- Sumber daya -----
                  root.addView(section("Sumber daya", R.drawable.ic_storage))
                  ramCard = addCard("RAM", R.drawable.ic_memory)
                  internalCard = addCard("Internal", R.drawable.ic_storage)
                  sharedCard = addCard("Penyimpanan bersama internal", R.drawable.ic_storage)

                  // ----- CPU -----
                  root.addView(section("Frekuensi CPU", R.drawable.ic_memory).apply {
                      setPadding(dp(4), dp(36), 0, 0)
                  })
                  cpuBox = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  root.addView(cpuBox)

                  updateResources()
                  loadCpu()
              }

              override fun onResume() { super.onResume(); handler.post(ticker) }
              override fun onPause() { handler.removeCallbacks(ticker); super.onPause() }

              // ---------- Sumber daya ----------
              private fun section(title: String, icon: Int): View =
                  LinearLayout(this).apply {
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(4), dp(12), 0, 0)
                      addView(ImageView(context).apply {
                          setImageResource(icon); setColorFilter(green)
                          layoutParams = LinearLayout.LayoutParams(dp(28), dp(28))
                      })
                      addView(label(title, 20f, green).apply {
                          typeface = Typeface.DEFAULT_BOLD
                          setPadding(dp(12), 0, 0, 0)
                      })
                  }

              private fun addCard(title: String, icon: Int): ResCard {
                  val card = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(18), dp(16), dp(18), dp(16))
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#1D1B20")); cornerRadius = dp(24).toFloat()
                      }
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { topMargin = dp(12) }
                  }
                  val head = LinearLayout(this).apply { gravity = Gravity.CENTER_VERTICAL }
                  head.addView(ImageView(this).apply {
                      setImageResource(icon); setColorFilter(green)
                      layoutParams = LinearLayout.LayoutParams(dp(28), dp(28))
                  })
                  head.addView(label(title, 20f, Color.WHITE).apply {
                      typeface = Typeface.DEFAULT_BOLD
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                          .apply { leftMargin = dp(12); rightMargin = dp(8) }
                  })
                  val pct = label("0%", 20f, green)
                  head.addView(pct)

                  val bar = WaveBar(this).apply {
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, dp(18)
                      ).apply { topMargin = dp(10) }
                  }
                  val detail = label("", 14f, Color.parseColor("#C9C5CA")).apply {
                      setPadding(0, dp(6), 0, 0)
                  }
                  card.addView(head); card.addView(bar); card.addView(detail)
                  root.addView(card)
                  return ResCard(bar, pct, detail)
              }

              private fun fmtMb(b: Long) = String.format(Locale.US, "%,d MB", b / 1048576L)
              private fun fmtGb(b: Long) = String.format(Locale.US, "%.1f GB", b / 1073741824.0)

              private fun setCard(c: ResCard, used: Long, free: Long, total: Long, fmt: (Long) -> String) {
                  val p = if (total > 0) used.toFloat() / total else 0f
                  c.bar.progress = p
                  c.pct.text = "${(p * 100).toInt()}%"
                  c.detail.text = "Used ${fmt(used)} • Free ${fmt(free)} • Total ${fmt(total)}"
              }

              private fun updateResources() {
                  // RAM
                  val am = getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                  val mi = ActivityManager.MemoryInfo()
                  am.getMemoryInfo(mi)
                  setCard(ramCard, mi.totalMem - mi.availMem, mi.availMem, mi.totalMem, ::fmtMb)

                  // Penyimpanan internal (/data)
                  stat(Environment.getDataDirectory().path)?.let { (u, f, t) ->
                      setCard(internalCard, u, f, t, ::fmtGb)
                  }
                  // Penyimpanan bersama internal (/sdcard)
                  @Suppress("DEPRECATION")
                  val sharedPath = Environment.getExternalStorageDirectory().path
                  stat(sharedPath)?.let { (u, f, t) ->
                      setCard(sharedCard, u, f, t, ::fmtGb)
                  }
              }

              private fun stat(path: String): Triple<Long, Long, Long>? = try {
                  val s = StatFs(path)
                  val total = s.totalBytes
                  val free = s.availableBytes
                  Triple(total - free, free, total)
              } catch (e: Exception) { null }

              // ---------- Root helper ----------
              private fun su(cmd: String): String = try {
                  val p = Runtime.getRuntime().exec(arrayOf("su", "-c", cmd))
                  val out = p.inputStream.bufferedReader().readText()
                  p.waitFor()
                  out
              } catch (e: Exception) { "" }

              // ---------- CPU ----------
              private fun loadCpu() {
                  Thread {
                      val ids = su("ls $base").lines()
                          .filter { it.startsWith("policy") }
                          .mapNotNull { it.removePrefix("policy").trim().toIntOrNull() }
                          .sorted()

                      val list = ids.map { id ->
                          val out = su(
                              "cd $base/policy$id; for f in affected_cpus scaling_min_freq " +
                              "scaling_max_freq scaling_governor scaling_available_frequencies " +
                              "scaling_available_governors; do cat \$f 2>/dev/null; echo; done"
                          ).lines()
                          fun l(i: Int) = out.getOrElse(i) { "" }.trim()
                          Policy(
                              id, l(0),
                              l(1).toLongOrNull() ?: 0, l(2).toLongOrNull() ?: 0, l(3),
                              l(4).split(" ").mapNotNull { it.toLongOrNull() }.sortedDescending(),
                              l(5).split(" ").filter { it.isNotBlank() }
                          )
                      }
                      runOnUiThread { renderCpu(list) }
                  }.start()
              }

              private fun renderCpu(list: List<Policy>) {
                  cpuBox.removeAllViews()
                  if (list.isEmpty()) {
                      cpuBox.addView(label("Tidak ada data cpufreq / akses root ditolak.", 16f, Color.WHITE))
                      return
                  }
                  list.forEachIndexed { i, p ->
                      val name = when {
                          list.size == 1 -> "CPU"
                          i == 0 -> "Little cluster"
                          i == list.lastIndex -> "Big cluster"
                          else -> "Middle cluster"
                      }
                      cpuBox.addView(label("$name  (core ${p.cores})", 18f, green).apply {
                          setPadding(0, dp(20), 0, dp(4))
                      })
                      cpuBox.addView(row("Minimum CPU frequency", "${p.min / 1000} MHz") {
                          pickFreq("Minimum CPU frequency", p, p.min) { setMin(p, it) }
                      })
                      cpuBox.addView(row("Maximum CPU frequency", "${p.max / 1000} MHz") {
                          pickFreq("Maximum CPU frequency", p, p.max) { setMax(p, it) }
                      })
                      cpuBox.addView(row("Governor", p.gov) { pickGov(p) })
                  }
              }

              private fun label(t: String, size: Float, color: Int) = TextView(this).apply {
                  text = t; textSize = size; setTextColor(color)
              }

              private fun row(title: String, value: String, onClick: () -> Unit): View =
                  LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(0, dp(12), 0, dp(12))
                      gravity = Gravity.CENTER_VERTICAL
                      addView(label(title, 16f, Color.WHITE))
                      addView(label(value, 14f, Color.parseColor("#9E9E9E")))
                      setOnClickListener { onClick() }
                  }

              private fun pickFreq(title: String, p: Policy, current: Long, onPick: (Long) -> Unit) {
                  if (p.freqs.isEmpty()) {
                      Toast.makeText(this, "Daftar frekuensi tidak tersedia", Toast.LENGTH_SHORT).show()
                      return
                  }
                  val labels = p.freqs.map { "${it / 1000} MHz" }.toTypedArray()
                  AlertDialog.Builder(this)
                      .setTitle(title)
                      .setSingleChoiceItems(labels, p.freqs.indexOf(current)) { d, which ->
                          onPick(p.freqs[which]); d.dismiss()
                      }
                      .show()
              }

              private fun pickGov(p: Policy) {
                  AlertDialog.Builder(this)
                      .setTitle("Governor")
                      .setSingleChoiceItems(p.govs.toTypedArray(), p.govs.indexOf(p.gov)) { d, which ->
                          apply("echo ${p.govs[which]} > $base/policy${p.id}/scaling_governor")
                          d.dismiss()
                      }
                      .show()
              }

              private fun setMin(p: Policy, f: Long) {
                  val d = "$base/policy${p.id}"
                  val pre = if (f > p.max) "echo $f > $d/scaling_max_freq; " else ""
                  apply("${pre}echo $f > $d/scaling_min_freq")
              }

              private fun setMax(p: Policy, f: Long) {
                  val d = "$base/policy${p.id}"
                  val pre = if (f < p.min) "echo $f > $d/scaling_min_freq; " else ""
                  apply("${pre}echo $f > $d/scaling_max_freq")
              }

              private fun apply(cmd: String) {
                  Thread { su(cmd); runOnUiThread { loadCpu() } }.start()
              }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
          }
