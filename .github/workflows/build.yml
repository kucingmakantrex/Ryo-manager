          }
          rootProject.name = "RyoManager"
          include(":app")
          EOF_FILE

      - name: Build debug APK
        working-directory: ${{ runner.temp }}/proj
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: RyoManager-debug
          path: ${{ runner.temp }}/proj/app/build/outputs/apk/debug/app-debug.apk
